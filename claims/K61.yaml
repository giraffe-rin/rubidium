id: K61
title: 族 q·a + r = s·2^N（r = ±1、β₀ = 3r + q ≠ 0、v = v2(β₀) < N）、m = 3a − 2 で、間隔の列の先頭の m+2 の連の長さは、ブロック 0（K3）からの h の鎖の b の軌道と、鎖が N + v2(c) を越える場面の規則（補題 K59.1 の r = ±1 版）で決まる（命題 K57 の一般化）。ただし鎖の各奇数点で b + 3r ≠ 0、各 E = N + γ の越える場面で inner = r b′ + q c_o s ≠ 0 かつ u = v2(inner) < N を仮定する（2026-11-25 追記で追加。gemini-2 の査読 PR #371 の指摘）。
