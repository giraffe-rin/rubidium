id: K63
title: "予想 K63：m + 1 = 8u（u 奇数）、v2(9u+1) = 1、v2(11u+1) = 2e（e ≥ 2）、Y = (11u+1)/2^{2e} とする。(1) e = 2 で Y ≡ 1 (mod 4) なら交互型。(2) e ≥ 3 で Y ≡ 3 (mod 4) なら交互型でない。u ≤ 20000 で反例なし（(1) 313 個、(2) 105 個。漸化式 R による。u ≤ 1200 は直接の DP でも一致）。ほかの類（e = 2 で Y ≡ 3、e ≥ 3 で Y ≡ 1）は混在"
