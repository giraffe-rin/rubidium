id: K33
title: e ≥ 7 で m = 9·2^e + 1 の型は、e 偶数なら周期 1^{e/2} 0（定理 K33a）、e 奇数なら周期 1^{e−1} 0 1^{(e−1)/2} 0（前周期なし）。e 奇数は、7 ≤ e ≤ 19 を prove で、e ≥ 21 を鎖の形が e によらないこと（定理 K34・K58 と同じ方法、計算機による形の比較を含む）で示す。
