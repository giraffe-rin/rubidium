name: AI Researcher (Claude)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード (auto / fix-only / new-proof)'
        required: false
        default: 'auto'
      force_run:
        description: 'AUTONOMOUS_ENABLED=false でも手動実行する'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: rubidium-ai-researcher
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # secrets は step の if: から参照できないため、job の env で真偽値に変換して使う
    env:
      HAS_APP_CREDS: ${{ secrets.RUBIDIUM_APP_ID != '' && secrets.RUBIDIUM_APP_PRIVATE_KEY != '' }}
      HAS_CLAUDE_CREDS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    if: >-
      (github.event_name == 'schedule' && vars.AUTONOMOUS_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.force_run == true || vars.AUTONOMOUS_ENABLED == 'true'))

    steps:
      - name: Generate GitHub App Token (if configured)
        id: app_token
        continue-on-error: true
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RUBIDIUM_APP_ID }}
          private-key: ${{ secrets.RUBIDIUM_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ruca-logic
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Decide next task (deterministic, from data/dag.json and open PRs)
        id: task
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base ruca-logic \
            --json number,title,isDraft,headRefName,headRepositoryOwner,author > /tmp/open_prs.json
          python3 scripts/autonomous_ops.py next-task --prs-json /tmp/open_prs.json --me "agent/claude-1/" | tee /tmp/next_task.json

      - name: Run Claude Code autonomous research cycle
        if: env.HAS_CLAUDE_CREDS == 'true' && steps.task.outputs.action != 'stop'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 25"
          prompt: |
            あなたは rubidium 研究チームの自律エージェント `claude-1` です。
            `AGENTS.md` と `.claude/skills/research-cycle/SKILL.md` を熟読し、その手順どおりに 1 サイクルだけ実行してください。
            ブランチ名は必ず `agent/claude-1/<SG-ID小文字>-<短い説明>` にしてください。
            次の課題は `scripts/autonomous_ops.py next-task --me agent/claude-1/` で決定済みです（action: `${{ steps.task.outputs.action }}`、subgoal: `${{ steps.task.outputs.subgoal || 'なし' }}`、PR: `${{ steps.task.outputs.pr || 'なし' }}`）。完全な出力は `/tmp/next_task.json` にあります。`release_prs` に PR があれば先に閉じてください。
            モード: ${{ inputs.mode || 'auto' }}（`fix-only` のときは新しい担当を取らず、自分の既存 PR の修正だけを行う）。要確認条件に該当する場合は `needs-human` を明記して停止してください。
