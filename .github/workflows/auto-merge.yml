name: Auto Merge & Status Sync

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '対象PR番号'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rubidium-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (vars.AUTONOMOUS_ENABLED == 'true')

    steps:
      - name: Generate GitHub App Token (if configured)
        id: app_token
        continue-on-error: true
        if: secrets.RUBIDIUM_APP_ID != '' && secrets.RUBIDIUM_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RUBIDIUM_APP_ID }}
          private-key: ${{ secrets.RUBIDIUM_APP_PRIVATE_KEY }}

      - name: Evaluate and merge eligible PRs
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          TARGET_PR: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
        run: |
          if [ -n "$TARGET_PR" ]; then
            CANDIDATES="$TARGET_PR"
          else
            CANDIDATES=$(gh pr list --state open --base ruca-logic --json number --jq '.[].number')
          fi

          for PR in $CANDIDATES; do
            INFO=$(gh pr view "$PR" --json number,state,mergeable,reviewDecision,labels,statusCheckRollup)
            ELIGIBLE=$(echo "$INFO" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          labels = {l['name'].lower() for l in d.get('labels', [])}
          if d.get('state') != 'OPEN':
              print('skip:not-open'); sys.exit(0)
          if 'needs-human' in labels or '要確認' in labels or 'do-not-merge' in labels:
              print('skip:human-gate'); sys.exit(0)
          if d.get('mergeable') != 'MERGEABLE':
              print('skip:not-mergeable'); sys.exit(0)
          if d.get('reviewDecision') != 'APPROVED':
              print('skip:not-approved'); sys.exit(0)
          checks = d.get('statusCheckRollup', [])
          if not checks or any(c.get('conclusion') not in ('SUCCESS', 'SKIPPED', 'NEUTRAL') for c in checks):
              print('skip:checks-pending-or-failed'); sys.exit(0)
          print('ok')
          ")
            echo "PR #${PR}: ${ELIGIBLE}"
            if [ "$ELIGIBLE" = "ok" ]; then
              gh pr merge "$PR" --squash --delete-branch
            fi
          done
