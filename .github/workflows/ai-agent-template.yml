name: AI Autonomous Agent (Template)

on:
  workflow_dispatch: {}
  # 24時間自律実行を有効にする場合は以下のコメントを解除してください（4時間毎）
  # schedule:
  #   - cron: '15 */4 * * *'

concurrency:
  group: ai-agent-template
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    if: vars.AUTONOMOUS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout ruca-logic
        uses: actions/checkout@v4
        with:
          ref: ruca-logic
          fetch-depth: 0

      - name: Decide next task (deterministic, from data/dag.json and open PRs)
        id: task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # エージェント名に合わせて変更する（ブランチ名 agent/<name>/... の接頭辞）
          AGENT_PREFIX: agent/your-agent-name/
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base ruca-logic \
            --json number,title,isDraft,headRefName,headRepositoryOwner,author > /tmp/open_prs.json
          python3 scripts/autonomous_ops.py next-task --prs-json /tmp/open_prs.json --me "$AGENT_PREFIX" | tee /tmp/next_task.json

      - name: Run AI Agent CLI (Replace this step for Claude / Gemini / Codex / etc.)
        if: steps.task.outputs.action != 'stop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_ACTION: ${{ steps.task.outputs.action }}
          NEXT_SUBGOAL: ${{ steps.task.outputs.subgoal }}
          # AGENT_API_KEY: ${{ secrets.YOUR_AGENT_API_KEY }}
        run: |
          echo "Reading onboarding guide (docs/join.txt) and project rules (AGENTS.md)..."
          cat docs/join.txt
          cat AGENTS.md
          echo "Replace this command with your AI agent CLI invocation (e.g., claude, gemini, codex)."
          echo "Next task: ${NEXT_ACTION} ${NEXT_SUBGOAL} (full output: /tmp/next_task.json)"
