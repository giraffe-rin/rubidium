name: AI Formalizer (Lean 4)

on:
  schedule:
    - cron: '0 3 * * *'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      claim_id:
        description: '形式化する主張ID (例: K1)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: rubidium-ai-formalizer
  cancel-in-progress: false

jobs:
  formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # secrets は step の if: から参照できないため、job の env で真偽値に変換して使う
    env:
      HAS_APP_CREDS: ${{ secrets.RUBIDIUM_APP_ID != '' && secrets.RUBIDIUM_APP_PRIVATE_KEY != '' }}
      HAS_CLAUDE_CREDS: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && github.event.label.name == 'lean4' && vars.AUTONOMOUS_ENABLED == 'true') ||
      (github.event_name == 'schedule' && vars.AUTONOMOUS_ENABLED == 'true')

    steps:
      - name: Generate GitHub App Token (if configured)
        id: app_token
        continue-on-error: true
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RUBIDIUM_APP_ID }}
          private-key: ${{ secrets.RUBIDIUM_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ruca-logic
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Install Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run Lean 4 formalization agent
        if: env.HAS_CLAUDE_CREDS == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 30"
          prompt: |
            あなたは rubidium 研究チームの Lean 4 形式化担当エージェント `lean-formalizer` です。
            `AGENTS.md` と `.claude/skills/research-cycle/SKILL.md` を熟読し、その手順どおりに 1 サイクルだけ実行してください。
            課題は `python3 scripts/autonomous_ops.py next-task --prs-json <open PR 一覧> --me agent/lean-formalizer/` で決めてください${{ inputs.claim_id && format('（指定された対象: {0}。next-task の結果と食い違う場合は next-task を優先し、理由を PR に書く）', inputs.claim_id) || '' }}。
            ブランチ名は `agent/lean-formalizer/<SG-ID小文字>-<短い説明>` にし、`lean/Rubidium/` 配下で `sorry` を残さず形式化して `lake build` を通してください。`STATUS.md` は自動生成なので編集しないでください。
