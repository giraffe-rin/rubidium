name: Rubidium CI

on:
  push:
    branches:
      - ruca-logic
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for the autonomous control script
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate data/dag.json and preview next task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base ruca-logic \
            --json number,title,isDraft,headRefName,headRepositoryOwner,author > /tmp/open_prs.json
          python3 scripts/autonomous_ops.py next-task --prs-json /tmp/open_prs.json

      - name: Check for sorry in Lean 4 files
        run: |
          if [ -d lean ]; then
            if grep -rnE '\bsorry\b' lean --include='*.lean'; then
              echo "ERROR: 'sorry' found in lean/ files."
              exit 1
            fi
          fi
          echo "OK: No 'sorry' found in lean/ files."
